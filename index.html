<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sweet Dreams — Registro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg-deep:#0B1440;
    --bg-card:#12205C;
    --bg-field:#1B2C78;
    --lavender:#3355FF;
    --pink:#F4ECD8;
    --gold:#EFE3C0;
    --text:#F4ECD8;
    --muted:#9FB0E8;
    --line:#28399E;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 15% 8%, rgba(244,236,216,0.16), transparent 40%),
      radial-gradient(circle at 85% 0%, rgba(51,85,255,0.20), transparent 45%),
      var(--bg-deep);
    color:var(--text);
    font-family:'Poppins', sans-serif;
    min-height:100vh;
    padding:0 0 60px;
  }
  .hero{
    position:relative;
    overflow:hidden;
    padding:52px 20px 46px;
    text-align:center;
    background:linear-gradient(180deg, #16226B 0%, #0B1440 100%);
    border-bottom:1px solid var(--line);
  }
  .stars{ position:absolute; inset:0; pointer-events:none; }
  .stars span{
    position:absolute; width:3px;height:3px;
    background:var(--text); border-radius:50%; opacity:.55;
    animation:twinkle 3.4s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{opacity:.15; transform:scale(1);}
    50%{opacity:.9; transform:scale(1.5);}
  }
  .moon{ font-size:34px; filter:drop-shadow(0 0 18px rgba(239,227,192,.55)); margin-bottom:6px; display:inline-block; }
  .eyebrow{ letter-spacing:.32em; font-size:11px; color:var(--gold); text-transform:uppercase; margin:0 0 10px; font-weight:600; }
  h1.title{
    font-family:'Bebas Neue', sans-serif;
    font-size:clamp(48px,11vw,76px);
    letter-spacing:.04em; margin:0; line-height:.95;
    color:var(--text);
  }
  .subtitle{ margin:14px auto 0; max-width:420px; color:var(--muted); font-size:14.5px; line-height:1.6; }
  .info-row{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:22px; }
  .chip{
    border:1px solid var(--line); background:rgba(255,255,255,0.03);
    padding:8px 14px; border-radius:999px; font-size:12.5px; color:var(--text);
    display:flex; align-items:center; gap:6px;
  }
  .badge18{
    margin-top:20px; display:inline-flex; align-items:center; gap:8px;
    background:rgba(244,236,216,0.12); border:1px solid rgba(244,236,216,0.4);
    color:var(--pink); padding:8px 16px; border-radius:999px; font-size:12px; font-weight:600; letter-spacing:.03em;
  }
  .wrap{ max-width:520px; margin:-18px auto 0; padding:0 18px; }
  .card{
    background:var(--bg-card); border:1px solid var(--line); border-radius:18px;
    padding:26px 22px; margin-top:18px; box-shadow:0 20px 50px rgba(0,0,0,.35);
  }
  .card.top{ border-top:4px solid var(--pink); }
  .section-label{
    display:flex; align-items:center; gap:8px; font-size:12.5px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--gold); font-weight:700; margin-bottom:18px;
  }
  label{ display:block; font-size:14px; font-weight:600; margin:18px 0 8px; }
  label .req{ color:var(--pink); margin-left:3px; }
  label:first-of-type{ margin-top:0; }
  input[type="text"], input[type="tel"], input[type="email"], input[type="number"], textarea{
    width:100%; background:var(--bg-field); border:1px solid var(--line); border-radius:10px;
    padding:12px 13px; color:var(--text); font-family:'Poppins', sans-serif; font-size:14.5px;
    outline:none; transition:border-color .15s ease, box-shadow .15s ease;
  }
  textarea{ resize:vertical; min-height:70px; font-family:'Poppins', sans-serif; }
  input::placeholder, textarea::placeholder{ color:#6E6294; }
  input:focus, textarea:focus{ border-color:var(--lavender); box-shadow:0 0 0 3px rgba(51,85,255,0.18); }
  .radio-group{ display:flex; flex-direction:column; gap:9px; margin-top:6px; }
  .radio-option{
    display:flex; align-items:center; gap:10px; background:var(--bg-field);
    border:1px solid var(--line); border-radius:10px; padding:11px 13px; cursor:pointer;
    font-size:14px; transition:border-color .15s ease;
  }
  .radio-option:has(input:checked){ border-color:var(--pink); background:rgba(244,236,216,0.08); }
  .radio-option input{ accent-color:var(--pink); width:16px; height:16px; }
  .check-option{
    display:flex; align-items:flex-start; gap:10px; background:var(--bg-field);
    border:1px solid var(--line); border-radius:10px; padding:13px; margin-top:6px;
    cursor:pointer; font-size:13.5px; color:var(--muted); line-height:1.5;
  }
  .check-option input{ margin-top:2px; accent-color:var(--gold); width:16px; height:16px; flex:none; }
  .hint{ font-size:12px; color:var(--muted); margin-top:6px; }
  .note-box{
    background:rgba(239,227,192,0.08); border:1px solid rgba(239,227,192,0.35);
    color:var(--gold); border-radius:10px; padding:12px 14px; font-size:12.5px; line-height:1.6; margin-top:6px;
  }
  .submit-btn{
    width:100%; margin-top:26px; padding:15px; border:none; border-radius:12px;
    background:var(--text); color:var(--bg-deep);
    font-family:'Poppins', sans-serif; font-weight:700; font-size:15px; letter-spacing:.02em;
    cursor:pointer; transition:transform .12s ease, opacity .12s ease;
  }
  .submit-btn:hover{ transform:translateY(-1px); }
  .submit-btn:disabled{ opacity:.6; cursor:default; transform:none; }
  .confirm{ display:none; text-align:center; padding:10px 4px 4px; }
  .confirm .check{
    width:56px; height:56px; border-radius:50%; background:var(--lavender);
    display:flex; align-items:center; justify-content:center; font-size:26px; margin:6px auto 16px;
  }
  .confirm h2{ font-family:'Bebas Neue', sans-serif; font-size:30px; letter-spacing:.03em; margin:0 0 8px; }
  .confirm p{ color:var(--muted); font-size:14px; line-height:1.6; margin:0 0 4px; }
  .recap{ text-align:left; background:var(--bg-field); border:1px solid var(--line); border-radius:12px; padding:16px; margin-top:18px; font-size:13.5px; }
  .recap div{ display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--line); }
  .recap div:last-child{ border-bottom:none; }
  .recap span:first-child{ color:var(--muted); }
  .again{ margin-top:20px; background:none; border:1px solid var(--line); color:var(--text); padding:11px 16px; border-radius:10px; cursor:pointer; font-size:13px; }
  footer{ text-align:center; color:#5C5182; font-size:11.5px; margin-top:26px; padding:0 20px; }
  footer a{ color:#5C5182; text-decoration:underline; }
</style>
</head>
<body>

  <div class="stars" id="stars"></div>
  <div class="moon">✨</div>
  <p class="eyebrow">BRUKOFF PRESENTA</p>

    <div class="chip">🕘 9:00 PM</div>
    <div class="chip">📍 Rancho Agüeros</div>
  </div>
